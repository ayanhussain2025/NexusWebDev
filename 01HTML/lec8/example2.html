<!-- IIT-JEE Registration form -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form-Advance</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>IIT JEE Registration form</legend>
            <label for="fname">Full Name:</label>
            <input type="text" id="fname" name="fullname">
            <br><br>
            <label for="mail">Email:</label>
            <input type="email" id="mail" name="e-mail">
            <br><br>
            <label for="psswd">Password:</label>
            <input type="password" id="psswd" name="password">
            <br><br>
            <label for="">Gender:</label>
            <input type="radio" name="gender" id="male">
            <label for="male">Male:</label>
            <input type="radio" name="gender" id="female">
            <label for="female">Female:</label>
            <input type="radio" name="gender" id="other">
            <label for="other">other:</label>
            <br><br>
            <label for="date">DOB:</label>
            <input type="date" id="date" name="DOB">
            <br><br>
            <label for="sclname">schoolname:</label>
            <input type="text" id="sclname" name="schoolname">
            <br><br>
            <label for="board">Board:</label>
            <select name="board" id="board">
                <option value="" disabled selected>Select your Board</option>
                <option value="CBSE">CBSE</option>
                <option value="BSBE">BSBE</option>
                <option value="ICSE">ICSE</option>
            </select>
            <br><br>
            <label for="year">Year of Passing:</label>
            <input type="number" id="year" name="passingyear" min="2023" max="2026">
            <br><br>
            <label for="board">Board:</label>
            <select name="examcenter" id="exam">
                <option value="" disabled selected>Select Exam Center</option>
                <option value="Bihar">Bihar</option>
                <option value="Bhopal">Bhopal</option>
                <option value="Dharbahnga">Dharbahnga</option>
            </select>
            <br><br>
            <button>Regsiter</button>
        </fieldset>
    </form>
</body>
</html>
