<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How many days Until Summer Olympics</title>
    <link rel="stylesheet" href="./hw1.css">
</head>
<body id="gradient">
    <header>
        <nav>
            <div class="left-nav-bar">
                <img src="https://days.to/Content/images/days-to-logo-small.svg" alt="" class="nav-logo">
                <select name="dropbox" id="dropbox1">
                    <option value="" disabled selected>When is</option>
                </select>
                <select name="dropbox" id="dropbox2">
                    <option value="" disabled selected>Holidays</option>
                </select>
                <select name="dropbox" id="dropbox3">
                    <option value="" disabled selected>Events</option>
                </select>
                <a href="" id="cal">Calendar</a>
                <select name="dropbox" id="dropbox4">
                    <option value="" disabled selected>Help</option>
                </select>
            </div>
            <div class="right-nav-bar">
                <input type="text" placeholder="Search Here" class="input1">
                <button class="button1">Search</button>
            </div>
        </nav>
    </header>
    <main>
        <div class="olympic-details">
            <p class="font1">How many Days until</p>
            <p class="font2">Summer Olympics 2028</p>
            <p class="font3">Friday, 21 July 2028 00:00</p>
            <p class="font4" >Los Angeles, USA</p>
        </div>
        <div class="countdown">
            <div class="uppercountdown">
                <h1 class="timer-days"></h1>
                <h3 class="timer-days1">days</h3>
            </div>
            <div class="lowercountdown">
                <div class="arrange1">
                    <h2 class="timer timer-hours"></h2>
                    <p>Hours</p>
                </div>
                <div class="arrange2">
                    <h2 class="timer timer-minutes"></h2>
                    <p>Minutes</p>
                </div>
                <div class="arrange3">
                    <h2 class="timer timer-seconds"></h2>
                    <p>Seconds</p>
                </div>

            </div>
        </div>
    </main>
    <footer>
        <p>All times shown in Asia/Calcutta.</p>
    </footer>
    <script src="./hw1.js"></script>
</body>
</html>
