<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astrology Website</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="container">
    <h1>Astrology Form</h1>
    <form id="astroForm">
      <label for="fname">First Name</label>
      <input type="text" id="fname" required>

      <label for="sname">Surname</label>
      <input type="text" id="sname" required>

      <label for="date">Date</label>
      <input type="number" id="date" min="1" max="31" required>

      <label for="month">Month</label>
      <input type="number" id="month" min="1" max="12" required>

      <label for="year">Year</label>
      <input type="number" id="year" min="1900" max="2100" required>

      <button type="submit">Get Zodiac</button>
    </form>
    <div class="result" id="result"></div>
  </div>
  <script src="./script.js"></script>
</body>
</html>
